# Privileged RBAC change detection
# Audits privileged Azure RBAC assignments, publishes a date-stamped CSV snapshot
# as a pipeline artifact, then diffs against the snapshot from ~2 days ago and
# notifies Slack only when something changed (new permanent / added Owner /
# User Access Administrator => red, other add/remove/elevation => amber).
#
# NOTE: the service connection identity must have RBAC *read* (e.g. Reader)
# across every in-scope subscription / management group to be audited.
# * this only serves to monitor permission creep, it is not thorough enough to provide
#   defense in the case of malicious elevation, as there are a few loopholes. Elevation 
#   notification email should continue to be monitored as usual

---
name: Privileged RBAC change detection (2-day)
trigger: none
pr: none

# Manual trigger only while under test. Re-enable the schedule below to run automatically.
# schedules:
#   - cron: '0 7 * * *'
#     displayName: Runs 7 AM daily
#     branches:
#       include:
#         - master
#     always: true

resources:
  repositories:
    # IaC source of truth for PIM-eligible Entra ID groups. Checked out read-only
    # so the change monitor can flag any alerting group that ISN'T declared as code.
    - repository: cnpAzureEntraPim
      type: github
      name: hmcts/cnp-azure-entra-pim
      ref: refs/heads/master
      endpoint: 'hmcts'

variables:
  - name: slackChannelName
    value:  "dtspo-daily-checks"
  - name: windowDays
    value: 2
  - name: azureServiceConnection
  # this doesn't have the read permission for PIM access, which we're not trying to monitor
    value: "dts-management-prod-intsvc"
  # Key Vault holding the Slack bot token (same KV the main daily pipeline uses).
  - name: keyVaultServiceConnection
    value: "DTS-CFTPTL-INTSVC"
  - name: keyVaultName
    value: "cftptl-intsvc"

jobs:
  - job: RBAC_PrivilegedChangeAudit
    displayName: 'Privileged RBAC change detection'
    timeoutInMinutes: 60
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      # Explicit multi-repo checkout. Pinning paths keeps `self` at
      # $(Build.SourcesDirectory) so every existing relative path still resolves,
      # and places the IaC repo in a sibling folder we read group names from.
      - checkout: self
        path: s
      - checkout: cnpAzureEntraPim
        path: iac-pim
        clean: true

      - task: AzureKeyVault@2
        displayName: 'Get Slack bot token from Key Vault'
        inputs:
          azureSubscription: $(keyVaultServiceConnection)
          keyVaultName: $(keyVaultName)
          secretsFilter: 'dtspo-daily-checks-slack-bot-token'

      - task: AzureCLI@2
        displayName: 'Audit privileged RBAC assignments'
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptPath: scripts/rbac/audit-privileged-rbac-p.sh
          arguments: >
            --outputDir $(Build.ArtifactStagingDirectory)

      - task: PublishPipelineArtifact@1
        displayName: 'Publish RBAC snapshot artifact'
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)
          artifact: rbac-snapshot
          publishLocation: pipeline

        # choses historic (2 days old) csv artefact as baseline to compare current changes against
      - task: Bash@3
        name: baseline
        displayName: 'Find baseline snapshot (~$(windowDays) days ago)'
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            MAX_TIME=$(date -u -d "$(windowDays) days ago" +%Y-%m-%dT%H:%M:%SZ)
            # only returns baselines from SUCCESSFUL and COMPLETED runs
            URL="$(System.CollectionUri)$(System.TeamProjectId)/_apis/build/builds?definitions=$(System.DefinitionId)&resultFilter=succeeded&statusFilter=completed&queryOrder=finishTimeDescending&maxTime=${MAX_TIME}&\$top=1&api-version=7.1"
            echo "Querying successful builds finished on/before ${MAX_TIME}"
            RESP=$(curl -sS -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" "$URL")
            BUILD_ID=$(echo "$RESP" | jq -r '.value[0].id // empty')
            if [[ -z "$BUILD_ID" ]]; then
              echo "No baseline build found; skipping change detection (no notification sent)."
              echo "##vso[task.setvariable variable=found;isOutput=true]false"
            else
              echo "Baseline build id: $BUILD_ID"
              echo "##vso[task.setvariable variable=found;isOutput=true]true"
              echo "##vso[task.setvariable variable=buildId;isOutput=true]$BUILD_ID"
            fi

      - task: DownloadPipelineArtifact@2
        displayName: 'Download baseline RBAC snapshot'
        condition: and(succeeded(), eq(variables['baseline.found'], 'true'))
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: $(System.DefinitionId)
          buildVersionToDownload: specific
          pipelineId: $(baseline.buildId)
          artifactName: rbac-snapshot
          targetPath: $(Pipeline.Workspace)/baseline
      # Extract the display names of IaC-managed PIM groups from the checked-out
      # cnp-azure-entra-pim repo. The monitor flags any alerting group NOT in this
      # list with an asterisk. Fails open: if the tfvars is missing we write an
      # empty list (no flagging) rather than break change detection.
      - task: Bash@3
        displayName: 'Extract IaC-managed group names'
        condition: and(succeeded(), eq(variables['baseline.found'], 'true'))
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            TFVARS="$(Agent.BuildDirectory)/iac-pim/users/pim-eligible/groups.tfvars"
            OUT="$(Build.SourcesDirectory)/iac-managed-groups.txt"
            if [[ ! -f "$TFVARS" ]]; then
              echo "WARNING: IaC tfvars not found at $TFVARS; group enrichment disabled this run." >&2
              : > "$OUT"
              exit 0
            fi
            grep -oE 'display_name[[:space:]]*=[[:space:]]*"[^"]+"' "$TFVARS" \
              | sed -E 's/.*"([^"]+)".*/\1/' \
              | sort -u > "$OUT"
            echo "Extracted $(wc -l < "$OUT") IaC-managed group name(s)."

#todo
      - task: Bash@3
        displayName: 'Detect privileged RBAC changes'
        condition: and(succeeded(), eq(variables['baseline.found'], 'true'))
        inputs:
          targetType: filePath
          workingDirectory: $(Build.SourcesDirectory)
          filePath: scripts/rbac/rbac-change-monitor.sh
          arguments: >
            --currentDir $(Build.ArtifactStagingDirectory)
            --baselineDir $(Pipeline.Workspace)/baseline
            --outputFile $(Build.SourcesDirectory)/rbac-change-status.txt
            --windowDays $(windowDays)
            --iacGroupsFile $(Build.SourcesDirectory)/iac-managed-groups.txt

      # Publish the diff report as a downloadable artifact BEFORE notifying Slack, so
      # the exact Slack-bound message can be inspected in the run for troubleshooting
      # (e.g. when a notification looks wrong or no alert fired). Runs even if the
      # detect step failed so a partial/empty report is still captured for diagnosis.
      - task: PublishPipelineArtifact@1
        displayName: 'Publish RBAC change report artifact'
        condition: and(always(), eq(variables['baseline.found'], 'true'))
        inputs:
          targetPath: $(Build.SourcesDirectory)/rbac-change-status.txt
          artifact: rbac-change-report
          publishLocation: pipeline

      - task: Bash@3
        displayName: 'Send RBAC change notification'
        condition: and(succeeded(), eq(variables['baseline.found'], 'true'))
        inputs:
          targetType: filePath
          workingDirectory: $(Build.SourcesDirectory)
          filePath: scripts/send-slack-header-thread-each-loop.sh
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName D08UQ8A63MF 
            --inputFileName $(Build.SourcesDirectory)/rbac-change-status.txt
            --messageHeader ":azure: RBAC Privileged Change Detection (2-day)"

      # C1 heartbeat: break the silence on failure. Every step above is gated on
      # succeeded()/baseline.found and the sender only posts when a change marker
      # exists, so a broken audit would otherwise send NOTHING and look identical
      # to a clean "no changes" run. This step runs only when something failed and
      # posts a loud red alert so a silently broken security control cannot hide.
      # NOTE: if the Key Vault step itself failed the Slack token is unavailable,
      # so this cannot post; rely on pipeline run-failure notifications for that case.
      - task: Bash@3
        displayName: 'Alert on control failure (heartbeat)'
        condition: failed()
        inputs:
          targetType: inline
          workingDirectory: $(Build.SourcesDirectory)
          script: |
            set -eo pipefail
            STATUS_FILE="$(Build.SourcesDirectory)/rbac-control-failure.txt"
            {
              echo ":red_circle: *RBAC privileged-change detection FAILED to complete.*"
              echo "Pipeline: $(System.DefinitionName) — run $(Build.BuildNumber)"
              echo "One or more steps errored, so privileged RBAC changes may be UNDETECTED for this window."
              echo "Investigate: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
            } > "$STATUS_FILE"
            scripts/send-slack-header-thread-each-loop.sh \
              --slackBotToken "$(dtspo-daily-checks-slack-bot-token)" \
              --slackChannelName D0AG03QQK9R \
              --inputFileName "$STATUS_FILE" \
              --messageHeader ":azure: RBAC Privileged Change Detection (2-day)"
