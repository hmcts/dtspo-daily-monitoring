# Privileged RBAC change detection
# Audits privileged Azure RBAC assignments, publishes a date-stamped CSV snapshot
# as a pipeline artifact, then diffs against the snapshot from ~2 days ago and
# notifies Slack only when something changed (new permanent / added Owner /
# User Access Administrator => red, other add/remove/elevation => amber).
#
# Ported from cpp-ops-daily-monitoring. dtspo differences vs cpp:
#   * Slack bot token comes from Key Vault (AzureKeyVault@2), not a variable group.
#   * Runs on hmcts-cftptl-agent-pool and posts to #dtspo-daily-checks.
#   * Audit identity is the dts-management-prod-intsvc service connection.
---
name: Privileged RBAC change detection (2-day)
trigger: none
pr: none

# Manual trigger only while under test. Re-enable the schedule below to run automatically.
# schedules:
#   - cron: '0 7 * * *'
#     displayName: Runs 7 AM daily
#     branches:
#       include:
#         - master
#     always: true

variables:
  - name: slackChannelName
    value:  "dtspo-daily-checks"
  - name: windowDays
    value: 2
  # Audit identity: must have RBAC *read* (e.g. Reader) across every in-scope
  # subscription / management group AND Microsoft Graph directory read
  # (e.g. Directory.Read.All) so principal display names resolve.
  - name: azureServiceConnection
    value: "dts-management-prod-intsvc"
  # Key Vault holding the Slack bot token (same KV the main daily pipeline uses).
  - name: keyVaultServiceConnection
    value: "DTS-CFTPTL-INTSVC"
  - name: keyVaultName
    value: "cftptl-intsvc"

jobs:
  - job: RBAC_PrivilegedChangeAudit
    displayName: 'Privileged RBAC change detection'
    timeoutInMinutes: 60
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - task: AzureKeyVault@2
        displayName: 'Get Slack bot token from Key Vault'
        inputs:
          azureSubscription: $(keyVaultServiceConnection)
          keyVaultName: $(keyVaultName)
          secretsFilter: 'dtspo-daily-checks-slack-bot-token'

      # NOTE: the service connection identity must have RBAC *read* (e.g. Reader)
      # across every in-scope subscription / management group to be audited.
      # todo check
      - task: AzureCLI@2
        displayName: 'Audit privileged RBAC assignments'
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptPath: scripts/rbac/audit-privileged-rbac.sh
          arguments: >
            --outputDir $(Build.ArtifactStagingDirectory)

      - task: PublishPipelineArtifact@1
        displayName: 'Publish RBAC snapshot artifact'
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)
          artifact: rbac-snapshot
          publishLocation: pipeline

        # choses historic (2 days old) csv artefact as baseline to compare current changes against
      - task: Bash@3
        name: baseline
        displayName: 'Find baseline snapshot (~$(windowDays) days ago)'
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            MAX_TIME=$(date -u -d "$(windowDays) days ago" +%Y-%m-%dT%H:%M:%SZ)
            URL="$(System.CollectionUri)$(System.TeamProjectId)/_apis/build/builds?definitions=$(System.DefinitionId)&resultFilter=succeeded&statusFilter=completed&queryOrder=finishTimeDescending&maxTime=${MAX_TIME}&\$top=1&api-version=7.1"
            echo "Querying successful builds finished on/before ${MAX_TIME}"
            RESP=$(curl -sS -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" "$URL")
            BUILD_ID=$(echo "$RESP" | jq -r '.value[0].id // empty')
            if [[ -z "$BUILD_ID" ]]; then
              echo "No baseline build found; skipping change detection (no notification sent)."
              echo "##vso[task.setvariable variable=found;isOutput=true]false"
            else
              echo "Baseline build id: $BUILD_ID"
              echo "##vso[task.setvariable variable=found;isOutput=true]true"
              echo "##vso[task.setvariable variable=buildId;isOutput=true]$BUILD_ID"
            fi

      - task: DownloadPipelineArtifact@2
        displayName: 'Download baseline RBAC snapshot'
        condition: and(succeeded(), eq(variables['baseline.found'], 'true'))
        inputs:
          buildType: specific
          project: $(System.TeamProjectId)
          definition: $(System.DefinitionId)
          buildVersionToDownload: specific
          pipelineId: $(baseline.buildId)
          artifactName: rbac-snapshot
          targetPath: $(Pipeline.Workspace)/baseline

      - task: Bash@3
        displayName: 'Detect privileged RBAC changes'
        condition: and(succeeded(), eq(variables['baseline.found'], 'true'))
        inputs:
          targetType: filePath
          workingDirectory: $(Build.SourcesDirectory)
          filePath: scripts/rbac/rbac-change-monitor.sh
          arguments: >
            --currentDir $(Build.ArtifactStagingDirectory)
            --baselineDir $(Pipeline.Workspace)/baseline
            --outputFile $(Build.SourcesDirectory)/rbac-change-status.txt
            --windowDays $(windowDays)

      - task: Bash@3
        displayName: 'Send RBAC change notification'
        condition: and(succeeded(), eq(variables['baseline.found'], 'true'))
        inputs:
          targetType: filePath
          workingDirectory: $(Build.SourcesDirectory)
          filePath: scripts/send-slack-header-thread-each-loop.sh
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName D0AG03QQK9R 
            --inputFileName $(Build.SourcesDirectory)/rbac-change-status.txt
            --messageHeader ":azure: RBAC Privileged Change Detection (2-day)"
