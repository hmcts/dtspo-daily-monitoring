---
name: Daily monitoring for platform operations
trigger: none
pr:
  - master
schedules:
  - cron: '00 8,13 * * Mon-Fri'
    displayName: Runs 9 AM & 2 PM Mon-Fri
    branches:
      include:
        - master
    always: 'true'

parameters:
  - name: gh_workflows
    type: object
    default:
      - repo: 'cnp-java-base'
        branch: 'master'
        run: 'cd'
      - repo: 'cnp-node-base'
        branch: 'master'
        run: 'cd'
      - repo: 'tech-docs-monitor'
        branch: 'main'
        run: '.github/workflows/run.yml'
      - repo: 'auto-shutdown'
        branch: 'master'
        run: 'aks-auto-start'
      - repo: 'auto-shutdown'
        branch: 'master'
        run: 'aks-auto-shutdown'
      - repo: 'auto-shutdown'
        branch: 'master'
        run: 'vm-auto-start'
      - repo: 'auto-shutdown'
        branch: 'master'
        run: 'vm-auto-shutdown'
      - repo: 'auto-shutdown'
        branch: 'master'
        run: 'AppGateway-auto-start'
      - repo: 'auto-shutdown'
        branch: 'master'
        run: 'AppGateway-auto-shutdown'
      - repo: 'auto-shutdown'
        branch: 'master'
        run: 'flexible-server-auto-start'
      - repo: 'auto-shutdown'
        branch: 'master'
        run: 'flexible-server-auto-shutdown'
      - repo: 'sandbox-auto-cleardown'
        branch: 'master'
        run: 'sandbox-cleanup'
  - name: ado_pipelines
    type: object
    default:
      - project: 'PlatformOperations'
        definitionId: '802'
        timeForAmber: '3'
        timeForRed: '5'
        pipelineName: Preview_Helm_release_cleanup_-_scheduled
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '840'
        timeForAmber: '3'
        timeForRed: '5'
        pipelineName: Preview_Helm_release_cleanup_-_PR_close
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '768'
        timeForAmber: '3'
        timeForRed: '7'
        pipelineName: ACR_Cleanup
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '777'
        timeForAmber: '14'
        timeForRed: '28'
        pipelineName: Launch_Darkly_cleanup
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '472'
        timeForAmber: '3'
        timeForRed: '7'
        pipelineName: Azure_AAD_group_cleanup
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '771'
        timeForAmber: '3'
        timeForRed: '7'
        pipelineName: OWASP_DB_Update_-_Production
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '808'
        timeForAmber: '3'
        timeForRed: '7'
        pipelineName: OWASP_DB_Update_-_Sandbox
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '1167'
        timeForAmber: '3'
        timeForRed: '7'
        pipelineName: "hmcts.trivy-acr-scan-import"
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '635'
        timeForAmber: '1'
        timeForRed: '3'
        pipelineName: "hmcts.azure-enterprise"
        branchName: refs/heads/main
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '543'
        timeForAmber: '1'
        timeForRed: '3'
        pipelineName: sds-azure-platform
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '765'
        timeForAmber: '1'
        timeForRed: '3'
        pipelineName: azure-platform-terraform
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '821'
        timeForAmber: '5'
        timeForRed: '7'
        pipelineName: azure-app-proxy
        branchName: refs/heads/main
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '534'
        timeForAmber: '5'
        timeForRed: '7'
        pipelineName: azure-resource-locks
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '529'
        timeForAmber: '1'
        timeForRed: '3'
        pipelineName: hmcts.postgresql-cron-jobs
        branchName: refs/heads/master
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '860'
        timeForAmber: '1'
        timeForRed: '3'
        pipelineName: hmcts.crime-portal-infra
        branchName: refs/heads/main
        weekdayOnly: true
      - project: 'PlatformOperations'
        definitionId: '927'
        timeForAmber: '1'
        timeForRed: '3'
        pipelineName: hmcts.sdrs-infra
        branchName: refs/heads/main
        weekdayOnly: true
      - project: 'PlatformOperations'
        definitionId: '1115'
        timeForAmber: '1'
        timeForRed: '3'
        pipelineName: Gaps2_DB_Restore_STG
        branchName: refs/heads/main
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '1116'
        timeForAmber: '1'
        timeForRed: '1'
        pipelineName: Gaps2_DB_Restore_PROD
        branchName: refs/heads/main
        weekdayOnly: false
      - project: 'PlatformOperations'
        definitionId: '518'
        timeForAmber: '7'
        timeForRed: '14'
        pipelineName: jenkins-packer
        branchName: refs/heads/master
        weekdayOnly: true
      - project: 'PlatformOperations'
        definitionId: '556'
        timeForAmber: '7'
        timeForRed: '14'
        pipelineName: bastion-packer
        branchName: refs/heads/master
        weekdayOnly: true
      - project: 'PlatformOperations'
        definitionId: '1147'
        timeForAmber: '7'
        timeForRed: '14'
        pipelineName: azure-resource-finops-scanner
        branchName: refs/heads/master
        weekdayOnly: true
      - project: 'PlatformOperations'
        definitionId: '1230'
        timeForAmber: '1'
        timeForRed: '3'
        pipelineName: "hmcts.azure-resource-finops-scanner (cost-export-merge)"
        branchName: refs/heads/master
        weekdayOnly: false
  - name: aks_clusters
    type: object
    default:
      - resourceGroup: 'cft-preview-00-rg'
        clusterName: 'cft-preview-00-aks'
        subscription: 'DCD-CFTAPPS-DEV'
      - resourceGroup: 'cft-preview-01-rg'
        clusterName: 'cft-preview-01-aks'
        subscription: 'DCD-CFTAPPS-DEV'
  - name: recovery_services_vaults
    type: object
    default:
      - resourceGroup: 'bau-bais_prod_resource_group'
        vaultName: 'recovery-vault-dmz-bau-bais-prod'
        subscription: 'DTS-SHAREDSERVICES-PROD'
      - resourceGroup: 'bau-bais_prod_resource_group'
        vaultName: 'recovery-vault-eft-bau-bais-prod'
        subscription: 'DTS-SHAREDSERVICES-PROD'
      - resourceGroup: 'libragob-prod-rg'
        vaultName: 'libragob-db-migration-prod-rsv-01'
        subscription: 'DTS-SHAREDSERVICES-PROD'
      - resourceGroup: 'externalspoke-rg'
        vaultName: 'rsv-prod-uks-her-01'
        subscription: 'DTS-HERITAGE-EXTSVC-PROD'
      - resourceGroup: 'internalspoke-rg'
        vaultName: 'rsv-prod-uks-her-02'
        subscription: 'DTS-HERITAGE-INTSVC-PROD'
  - name: certificates
    type: object
    default:
      - subscription: 'DCD-CFTAPPS-PROD'
        resource_group: 'lz-prod-rg'
        front_door_name: 'hmcts-prod'
        min_cert_exp_days: '14'
      - subscription: 'DTS-SHAREDSERVICES-PROD'
        resource_group: 'lz-prod-rg'
        front_door_name: 'sdshmcts-prod'
        min_cert_exp_days: '14'
      - subscription: 'DCD-CFTAPPS-SBOX'
        resource_group: 'lz-sbox-rg'
        front_door_name: 'hmcts-sbox'
        min_cert_exp_days: '14'
      - subscription: 'DTS-SHAREDSERVICES-PROD'
        resource_group: 'bau-bais_prod_network_rg'
        front_door_name: 'hmcts-heritage-prod'
        min_cert_exp_days: '14'
  - name: keyvault_certificates
    type: object
    default:
      - subscription: 'DCD-CFTAPPS-PROD'
        keyvault_name: 'acmedcdcftappsprod'
        min_cert_exp_days: '14'
      - subscription: 'DCD-CFTAPPS-STG'
        keyvault_name: 'acmedcdcftappsstg'
        min_cert_exp_days: '14'
      - subscription: 'DCD-CNP-Prod'
        keyvault_name: 'acmedcdcnpprod'
        min_cert_exp_days: '14'
      - subscription: 'DTS-ARCHIVING-PROD'
        keyvault_name: 'acmedtsarchivingprod'
        min_cert_exp_days: '14'
      - subscription: 'DTS-CFTPTL-INTSVC'
        keyvault_name: 'acmedtscftptlintsvc'
        min_cert_exp_days: '14'
      - subscription: 'DTS-SHAREDSERVICESPTL'
        keyvault_name: 'acmedtssdsptl'
        min_cert_exp_days: '14'
      - subscription: 'DTS-SHAREDSERVICES-PROD'
        keyvault_name: 'acmedtssdsprod'
        min_cert_exp_days: '14'
      - subscription: 'DTS-SHAREDSERVICES-STG'
        keyvault_name: 'acmedtssdsstg'
        min_cert_exp_days: '14'
      - subscription: 'HMCTS-HUB-PROD-INTSVC'
        keyvault_name: 'acmehmctshubprodintsvc'
        min_cert_exp_days: '14'
      - subscription: 'HMCTS-SOC-PROD'
        keyvault_name: 'acmehmctssocprod'
        min_cert_exp_days: '14'
      - subscription: 'DTS-ARCHIVING-PROD'
        keyvault_name: 'arm-kv-prod'
        min_cert_exp_days: '14'
  - name: postgres_subscriptions
    type: object
    default:
      - subscription: 'DCD-CNP-PROD'
      - subscription: 'DTS-SHAREDSERVICES-PROD'
      - subscription: 'DTS-HERITAGE-INTSVC-PROD'

variables:
  - name: SPSecretNumDays
    value: 14
  - name: service_connection
    value: dts-management-prod-intsvc
  - name: dev_service_connection
    value: GA-development-tenant
  - name: ado_service_connection
    value: OPS-APPROVAL-GATE-MGMT-ENVS
  - name: jenkins_url
    value: "http://jenkins.jenkins:8080/"
  - group: daily-checks-ghapp

jobs:
  - template: jobs/resolve-slack-recipient.yaml
  - template: jobs/daily-monitoring.yaml
    parameters:
      aks_clusters: ${{ parameters.aks_clusters }}
      service_connection: ${{ variables.service_connection }}
      ado_service_connection: ${{ variables.ado_service_connection }}
      jenkins_url: ${{ variables.jenkins_url }}
  - template: jobs/certificate-checks.yaml
    parameters:
      certificates: ${{ parameters.certificates }}
      keyvault_certificates: ${{ parameters.keyvault_certificates }}
  - template: jobs/github-workflow-checks.yaml
    parameters:
      gh_workflows: ${{ parameters.gh_workflows }}
  - template: jobs/ado-pipeline-checks.yaml
    parameters:
      ado_pipelines: ${{ parameters.ado_pipelines }}
  - template: jobs/license-checks.yaml
  - template: jobs/service-principal-checks.yaml
    parameters:
      service_connection: ${{ variables.service_connection }}
      dev_service_connection: ${{ variables.dev_service_connection }}
      SPSecretNumDays: ${{ variables.SPSecretNumDays }}
  - template: jobs/postgres-backup-checks.yaml
    parameters:
      postgres_subscriptions: ${{ parameters.postgres_subscriptions }}
      recovery_services_vaults: ${{ parameters.recovery_services_vaults }}
  - template: jobs/role-assignment-checks.yaml
  - template: jobs/combined-check-report.yaml
