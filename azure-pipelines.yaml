variables:
  - name: SPSecretNumDays
    value: 14
  - name: service_connection
    value: dts-management-prod-intsvc
  - name: dev_service_connection
    value: GA-development-tenant
  - name: ado_service_connection
    value: OPS-APPROVAL-GATE-MGMT-ENVS
  - name: jenkins_url
    value: "http://jenkins.jenkins:8080/"
  - group: daily-checks-ghapp

jobs:
  - job: ResolveSlackRecipient
    displayName: 'Resolve Slack notification recipient'
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
      - task: AzureKeyVault@2
        displayName: 'Get GitHub token'
        condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
        inputs:
          azureSubscription: 'DTS-CFTPTL-INTSVC'
          keyVaultName: 'cftptl-intsvc'
          secretsFilter: 'dtspo-daily-checks-github-fine-grained-token'
      - task: Bash@3
        name: recipient
        displayName: 'Set shared Slack recipient'
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            channel_name=$(bash scripts/resolve-slack-recipient.sh "dtspo-daily-checks")
            if [[ -z "$channel_name" ]]; then
              echo "Slack recipient lookup returned an empty destination." >&2
              exit 1
            fi
            echo "##vso[task.setvariable variable=main_channel;isOutput=true]${channel_name}"
        env:
          BUILD_REASON: $(Build.Reason)
          BUILD_SOURCEBRANCH: $(Build.SourceBranch)
          SYSTEM_PULLREQUEST_PULLREQUESTNUMBER: $(System.PullRequest.PullRequestNumber)
          SYSTEM_PULLREQUEST_PULLREQUESTID: $(System.PullRequest.PullRequestId)
          GITHUB_TOKEN: $(dtspo-daily-checks-github-fine-grained-token)
  - job: DailyMonitoring
    dependsOn: ResolveSlackRecipient
    variables:
      main_channel: $[ dependencies.ResolveSlackRecipient.outputs['recipient.main_channel'] ]
    timeoutInMinutes: 60
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
        persistCredentials: true
      - task: AzureKeyVault@2
        displayName: 'Get secrets from Keyvault'
        inputs:
          azureSubscription:  "DTS-CFTPTL-INTSVC"
          keyVaultName:   "cftptl-intsvc"
          secretsFilter: 'dtspo-daily-checks-slack-webhook-url,dtspo-daily-checks-slack-bot-token,azure-devops-token,jira-api-token,jira-username,dtspo-daily-checks-github-fine-grained-token,dtspo-daily-checks-github-classic-token,jenkins-api-user,jenkins-api-token,launchdarkly-access-token,b2c-prod-serviceprincipal-id,b2c-prod-serviceprincipal-password,b2c-prod-tenant-id,sendgrid-hmcts-bau-nonprod-apikey'
      - task: Bash@3
        displayName: 'Set test mode'
        inputs:
          targetType: inline
          script: |
            echo "##vso[task.setvariable variable=testMode]false"
      - script: |
          echo "main_channel set to: $(main_channel)"
        displayName: 'Show main channel name'
      # The following checks use the common-functions.sh slack notifications and threads functions and will only send if negative status is found
      - task: AzureCLI@2
        displayName: 'Orphaned Resource Status Check'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/orphan-resource-check.sh
          azureSubscription: ${{ variables.service_connection }}
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: Bash@3
        displayName: 'Checking Jenkins status'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/jenkins-status.sh
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
            --jenkinsUsername $(jenkins-api-user)
            --jenkinsApiToken $(jenkins-api-token)
            --jenkinsURL ${{ variables.jenkins_url }}
      - task: Bash@3
        displayName: "Checking GitHub Pages review status"
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/github_pages_checks.sh
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: Bash@3
        displayName: 'Checking JIRA status'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/jira-status.sh
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel) --jiraUsername $(jira-username) --jiraToken $(jira-api-token)
      - task: AzureCLI@2
        displayName: 'Get Provisioning State'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/cluster-state-monitor.sh
          azureSubscription: ${{ variables.ado_service_connection }}
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: AzureCLI@2
        displayName: 'Production Privileged Role Audit'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/rbac-privileged-role-audit.sh
          azureSubscription: 'GA-Prod-Tenant'
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: AzureCLI@2
        displayName: 'Check break-glass sign-ins'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/break-glass-signin-check.sh
          azureSubscription: 'GA-Prod-Tenant'
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: PublishPipelineArtifact@1
        displayName: 'Publish break-glass sign-in report'
        condition: always()
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)/scripts/break-glass-signin-check.sh'
          artifact: 'breakglass-signin-report'
      - task: Bash@3
        displayName: 'Commit break-glass sign-in report'
        continueOnError: true
        # Only master may commit the report; on other branches the rebase conflicts and the push targets master
        condition: and(always(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
        inputs:
          targetType: inline
          script: |
            set -euo pipefail

            git config user.email "${BUILD_REQUESTEDFOREMAIL:-azure-devops@local}"
            git config user.name "Azure Pipelines"
            git fetch origin master
            git add scripts/breakglass-signin-review.md

            if git diff --cached --quiet; then
              echo "No changes to the break-glass sign-in report."
              exit 0
            fi

            git commit -m "Update break-glass sign-in report [skip ci]"
            git rebase origin/master
            git push origin "HEAD:refs/heads/master"
      - task: Bash@3
        displayName: 'Check Toffee/Plum Status'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/check-toffee-plum.sh
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: Bash@3
        displayName: "Auto Shutdown status check"
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/autoShutdownChecks.sh
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: Bash@3
        displayName: 'Elastic search field count check'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/elastic-search-field-count.sh
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: Bash@3
        displayName: 'ElasticSearch DLQ Case Type count check'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/elastic-search-dlq-case-type-count.sh
          arguments: >
            --sendgridApiKey $(sendgrid-hmcts-bau-nonprod-apikey)
            --emailTo "cft-level2-monitoring-aaaap23kppmnpt57cp3cbwpkym@moj.org.slack.com"
            --emailFrom bau@mail-bau-nonprod.platform.hmcts.net
            --testMode $(testMode)
      - task: AzureCLI@2
        displayName: 'Check DR Backup Vault Job Status (weekly, Mondays only)'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/dr-backup-vault-monitor.sh
          azureSubscription: 'DCD-CNP-Prod'
          arguments: >
            --resourceGroup mgmt-infra-prod-rg
            --backupVault cnp-backup-vault
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
      - ${{ each cluster in parameters.aks_clusters }}:
        - task: AzureCLI@2
          displayName: 'AKS Cluster Status:  ${{cluster.clusterName}}'
          continueOnError: true
          inputs:
            scriptType: bash
            scriptPath: scripts/aks-node-count.sh
            azureSubscription: ${{ cluster.subscription }}
            arguments: --resourceGroup ${{cluster.resourceGroup}} --aksClusterName ${{cluster.clusterName}}
      - task: Bash@3
        displayName: "Send AKS Cluster Status"
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/send-slack-header-thread-each-loop.sh
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
            --inputFileName aks-cluster-status.txt
            --messageHeader ":aks: AKS Cluster Status Checks"
      # Final summary task - always runs and reports on any failed tasks
      - task: Bash@3
        displayName: "Pipeline Summary - Report Failed Tasks"
        condition: always()
        inputs:
          targetType: filePath
          filePath: scripts/pipeline-summary.sh
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
            --buildId $(Build.BuildId)
            --buildUrl "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
            --jobStatus $(Agent.JobStatus)
  - job: CertificateChecks
    displayName: 'Check certificates'
    dependsOn: ResolveSlackRecipient
    timeoutInMinutes: 60
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
      - task: Bash@3
        displayName: 'Initialize certificate results'
        inputs:
          targetType: inline
          script: |
            : > cert-status.txt
            : > keyvault-cert-status.txt
      - task: AzureKeyVault@2
        displayName: 'Get Slack token'
        inputs:
          azureSubscription: 'DTS-CFTPTL-INTSVC'
          keyVaultName: 'cftptl-intsvc'
          secretsFilter: 'dtspo-daily-checks-slack-bot-token,dtspo-daily-checks-github-fine-grained-token'
      - ${{ each frontdoor in parameters.certificates }}:
        - task: AzureCLI@2
          displayName: 'Checking ${{ frontdoor.front_door_name }} Certificate status'
          continueOnError: true
          inputs:
            scriptType: bash
            scriptPath: scripts/cert-check.sh
            azureSubscription: ${{ frontdoor.subscription }}
            arguments: >
              --subscription ${{ frontdoor.subscription }}
              --resourceGroup ${{ frontdoor.resource_group }}
              --frontdoorName ${{ frontdoor.front_door_name }}
              --minCertExpirationDays ${{ frontdoor.min_cert_exp_days }}
      - ${{ each keyvault in parameters.keyvault_certificates }}:
        - task: AzureCLI@2
          displayName: 'Checking ${{ keyvault.keyvault_name }} KeyVault Certificate status'
          continueOnError: true
          inputs:
            scriptType: bash
            scriptPath: scripts/keyvault-cert-check.sh
            azureSubscription: ${{ keyvault.subscription }}
            arguments: >
              --subscription ${{ keyvault.subscription }}
              --keyVaultName ${{ keyvault.keyvault_name }}
              --minCertExpirationDays ${{ keyvault.min_cert_exp_days }}
      - task: Bash@3
        displayName: 'Stage certificate results'
        condition: always()
        inputs:
          targetType: inline
          script: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/certificate-check-results"
            cat cert-status.txt keyvault-cert-status.txt > "$(Build.ArtifactStagingDirectory)/certificate-check-results/results.txt"
      - task: PublishPipelineArtifact@1
        displayName: 'Publish certificate results'
        condition: always()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/certificate-check-results/results.txt'
          artifact: 'certificate-check-results'
  - job: GithubWorkflowChecks
    displayName: 'Check GitHub workflows'
    dependsOn: ResolveSlackRecipient
    timeoutInMinutes: 60
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
      - task: Bash@3
        displayName: 'Initialize GitHub workflow results'
        inputs:
          targetType: inline
          script: ': > workflow-status.txt'
      - task: AzureKeyVault@2
        displayName: 'Get Slack and GitHub tokens'
        inputs:
          azureSubscription: 'DTS-CFTPTL-INTSVC'
          keyVaultName: 'cftptl-intsvc'
          secretsFilter: 'dtspo-daily-checks-slack-bot-token,dtspo-daily-checks-github-fine-grained-token'
      - ${{ each gh_workflow in parameters.gh_workflows }}:
        - task: Bash@3
          displayName: 'Check GitHub workflow Runs: ${{ gh_workflow.repo }} / ${{ gh_workflow.run }}'
          condition: always()
          inputs:
            targetType: filePath
            filePath: scripts/github-scheduled-workflow-monitor.sh
            arguments: --githubToken $(dtspo-daily-checks-github-fine-grained-token) --githubRepo ${{ gh_workflow.repo }} --branch ${{ gh_workflow.branch }} --run ${{ gh_workflow.run }}
      - task: Bash@3
        displayName: 'Stage GitHub workflow results'
        condition: always()
        inputs:
          targetType: inline
          script: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/github-workflow-results"
            cp workflow-status.txt "$(Build.ArtifactStagingDirectory)/github-workflow-results/results.txt"
      - task: PublishPipelineArtifact@1
        displayName: 'Publish GitHub workflow results'
        condition: always()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/github-workflow-results/results.txt'
          artifact: 'github-workflow-results'
  - job: AdoPipelineChecks
    displayName: 'Check Azure DevOps pipelines'
    dependsOn: ResolveSlackRecipient
    timeoutInMinutes: 60
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
      - task: Bash@3
        displayName: 'Initialize Azure DevOps pipeline results'
        inputs:
          targetType: inline
          script: ': > ado-pipeline-status.txt'
      - task: AzureKeyVault@2
        displayName: 'Get Slack and Azure DevOps tokens'
        inputs:
          azureSubscription: 'DTS-CFTPTL-INTSVC'
          keyVaultName: 'cftptl-intsvc'
          secretsFilter: 'dtspo-daily-checks-slack-bot-token,azure-devops-token'
      - ${{ each ado_pipeline in parameters.ado_pipelines }}:
        - task: Bash@3
          displayName: 'Checking Azure pipeline: ${{ ado_pipeline.pipelineName }}'
          continueOnError: true
          inputs:
            targetType: filePath
            filePath: scripts/ado-pipeline-monitor.sh
            arguments: >
              --adoToken $(azure-devops-token)
              --adoProject ${{ ado_pipeline.project }}
              --adoPipelineName "${{ ado_pipeline.pipelineName }}"
              --adoPipelineDefinitionId ${{ ado_pipeline.definitionId }}
              --adoTimeForAmber ${{ ado_pipeline.timeForAmber }}
              --adoTimeForRed ${{ ado_pipeline.timeForRed }}
              --adoPipelineBranch "${{ ado_pipeline.branchName }}"
              --weekdayOnly ${{ ado_pipeline.weekdayOnly }}
      - task: Bash@3
        displayName: 'Stage Azure DevOps pipeline results'
        condition: always()
        inputs:
          targetType: inline
          script: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/ado-pipeline-results"
            cp ado-pipeline-status.txt "$(Build.ArtifactStagingDirectory)/ado-pipeline-results/results.txt"
      - task: PublishPipelineArtifact@1
        displayName: 'Publish Azure DevOps pipeline results'
        condition: always()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/ado-pipeline-results/results.txt'
          artifact: 'ado-pipeline-results'
  - job: LicenseChecks
    displayName: 'Check licenses'
    dependsOn: ResolveSlackRecipient
    timeoutInMinutes: 30
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
      - task: Bash@3
        displayName: 'Initialize license results'
        inputs:
          targetType: inline
          script: ': > license-status.txt'
      - task: AzureKeyVault@2
        displayName: 'Get license API tokens'
        inputs:
          azureSubscription: 'DTS-CFTPTL-INTSVC'
          keyVaultName: 'cftptl-intsvc'
          secretsFilter: 'dtspo-daily-checks-github-classic-token,launchdarkly-access-token'
      - task: Bash@3
        displayName: 'Check GitHub licenses'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/github-licenses.sh
          arguments: >
            --token $(dtspo-daily-checks-github-classic-token)
            --outputFile license-status.txt
      - task: Bash@3
        displayName: 'Check LaunchDarkly licenses'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/ld-license.sh
          arguments: >
            --token $(launchdarkly-access-token)
            --outputFile license-status.txt
      - task: Bash@3
        displayName: 'Stage license results'
        condition: always()
        inputs:
          targetType: inline
          script: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/license-results"
            cp license-status.txt "$(Build.ArtifactStagingDirectory)/license-results/results.txt"
      - task: PublishPipelineArtifact@1
        displayName: 'Publish license results'
        condition: always()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/license-results/results.txt'
          artifact: 'license-results'
  - job: ServicePrincipalChecks
    displayName: 'Check service principals'
    dependsOn: ResolveSlackRecipient
    variables:
      main_channel: $[ dependencies.ResolveSlackRecipient.outputs['recipient.main_channel'] ]
    timeoutInMinutes: 45
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
      - task: Bash@3
        displayName: 'Initialize service-principal results'
        inputs:
          targetType: inline
          script: ': > service-principal-status.txt'
      - task: AzureKeyVault@2
        displayName: 'Get service-principal check secrets'
        inputs:
          azureSubscription: 'DTS-CFTPTL-INTSVC'
          keyVaultName: 'cftptl-intsvc'
          secretsFilter: 'dtspo-daily-checks-slack-bot-token,b2c-prod-serviceprincipal-id,b2c-prod-serviceprincipal-password,b2c-prod-tenant-id'
      - task: AzureCLI@2
        displayName: 'Service Principal Check - Dev Tenant'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/service-principals.sh
          azureSubscription: ${{ variables.dev_service_connection }}
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
            --checkDays ${{ variables.SPSecretNumDays }}
            --outputFile service-principal-status.txt
      - task: AzureCLI@2
        displayName: 'Service Principal Check'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/service-principals.sh
          azureSubscription: ${{ variables.service_connection }}
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
            --checkDays ${{ variables.SPSecretNumDays }}
            --outputFile service-principal-status.txt
      - task: AzureCLI@2
        displayName: 'Service Principal Check - B2C Sandbox Tenant'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/service-principals-b2c-tenants.sh
          azureSubscription: ${{ variables.service_connection }}
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
            --checkDays ${{ variables.SPSecretNumDays }}
            --outputFile service-principal-status.txt
        env:
          b2c_prod_serviceprincipal_id: $(b2c-prod-serviceprincipal-id)
          b2c_prod_serviceprincipal_password: $(b2c-prod-serviceprincipal-password)
          b2c_prod_tenant_id: $(b2c-prod-tenant-id)
      - task: Bash@3
        displayName: 'Stage service-principal results'
        condition: always()
        inputs:
          targetType: inline
          script: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/service-principal-results"
            cp service-principal-status.txt "$(Build.ArtifactStagingDirectory)/service-principal-results/results.txt"
      - task: PublishPipelineArtifact@1
        displayName: 'Publish service-principal results'
        condition: always()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/service-principal-results/results.txt'
          artifact: 'service-principal-results'
  - job: PostgresBackupChecks
    displayName: 'Check PostgreSQL and backups'
    dependsOn: ResolveSlackRecipient
    timeoutInMinutes: 60
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
      - task: Bash@3
        displayName: 'Initialize PostgreSQL and backup results'
        inputs:
          targetType: inline
          script: |
            : > postgres-status.txt
            : > azurebackup-status.txt
      - ${{ each postgres_sub in parameters.postgres_subscriptions }}:
        - task: AzureCLI@2
          displayName: 'Checking PostgreSQL Flexible Storage Status: ${{ postgres_sub.subscription }}'
          continueOnError: true
          inputs:
            scriptType: bash
            scriptPath: scripts/postgres-flexible-storage.sh
            azureSubscription: ${{ postgres_sub.subscription }}
            arguments: --subscription ${{ postgres_sub.subscription }}
      - ${{ each backup_vault in parameters.recovery_services_vaults }}:
        - task: AzureCLI@2
          displayName: 'Check Backup Status: ${{ backup_vault.vaultName }}'
          continueOnError: true
          inputs:
            scriptType: bash
            scriptPath: scripts/backup-monitor.sh
            azureSubscription: ${{ backup_vault.subscription }}
            arguments: --resourceGroup ${{ backup_vault.resourceGroup }} --backupVault ${{ backup_vault.vaultName }}
      - task: Bash@3
        displayName: 'Stage PostgreSQL and backup results'
        condition: always()
        inputs:
          targetType: inline
          script: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/postgres-backup-results"
            cp postgres-status.txt azurebackup-status.txt "$(Build.ArtifactStagingDirectory)/postgres-backup-results/"
      - task: PublishPipelineArtifact@1
        displayName: 'Publish PostgreSQL and backup results'
        condition: always()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/postgres-backup-results'
          artifact: 'postgres-backup-results'
  - job: CombinedCheckReport
    displayName: 'Report combined check results'
    dependsOn:
      - ResolveSlackRecipient
      - DailyMonitoring
      - CertificateChecks
      - GithubWorkflowChecks
      - AdoPipelineChecks
      - LicenseChecks
      - ServicePrincipalChecks
      - PostgresBackupChecks
    condition: and(always(), eq(dependencies.ResolveSlackRecipient.result, 'Succeeded'))
    variables:
      main_channel: $[ dependencies.ResolveSlackRecipient.outputs['recipient.main_channel'] ]
    timeoutInMinutes: 10
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
      - task: AzureKeyVault@2
        displayName: 'Get Slack token'
        inputs:
          azureSubscription: 'DTS-CFTPTL-INTSVC'
          keyVaultName: 'cftptl-intsvc'
          secretsFilter: 'dtspo-daily-checks-slack-bot-token'
      - task: DownloadPipelineArtifact@2
        displayName: 'Download certificate results'
        condition: always()
        continueOnError: true
        inputs:
          artifact: 'certificate-check-results'
          path: '$(Pipeline.Workspace)/certificate-check-results'
      - task: DownloadPipelineArtifact@2
        displayName: 'Download GitHub workflow results'
        condition: always()
        continueOnError: true
        inputs:
          artifact: 'github-workflow-results'
          path: '$(Pipeline.Workspace)/github-workflow-results'
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Azure DevOps pipeline results'
        condition: always()
        continueOnError: true
        inputs:
          artifact: 'ado-pipeline-results'
          path: '$(Pipeline.Workspace)/ado-pipeline-results'
      - task: DownloadPipelineArtifact@2
        displayName: 'Download license results'
        condition: always()
        continueOnError: true
        inputs:
          artifact: 'license-results'
          path: '$(Pipeline.Workspace)/license-results'
      - task: DownloadPipelineArtifact@2
        displayName: 'Download service-principal results'
        condition: always()
        continueOnError: true
        inputs:
          artifact: 'service-principal-results'
          path: '$(Pipeline.Workspace)/service-principal-results'
      - task: DownloadPipelineArtifact@2
        displayName: 'Download PostgreSQL and backup results'
        condition: always()
        continueOnError: true
        inputs:
          artifact: 'postgres-backup-results'
          path: '$(Pipeline.Workspace)/postgres-backup-results'
      - task: Bash@3
        displayName: 'Send combined check results'
        condition: always()
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            combinedResults="$(System.DefaultWorkingDirectory)/combined-check-results.txt"
            : > "$combinedResults"

            for resultFile in \
              "$(Pipeline.Workspace)/certificate-check-results/results.txt" \
              "$(Pipeline.Workspace)/github-workflow-results/results.txt" \
              "$(Pipeline.Workspace)/ado-pipeline-results/results.txt" \
              "$(Pipeline.Workspace)/license-results/results.txt" \
              "$(Pipeline.Workspace)/service-principal-results/results.txt" \
              "$(Pipeline.Workspace)/postgres-backup-results/postgres-status.txt" \
              "$(Pipeline.Workspace)/postgres-backup-results/azurebackup-status.txt"; do
              if [[ -f "$resultFile" ]]; then
                cat "$resultFile" >> "$combinedResults"
              else
                printf ':red_circle: Results could not be collected from %s.\n' "$(basename "$(dirname "$resultFile")")" >> "$combinedResults"
              fi
            done

            scripts/send-slack-header-thread-each-loop.sh \
              --slackBotToken "$(dtspo-daily-checks-slack-bot-token)" \
              --slackChannelName "$(main_channel)" \
              --inputFileName "$combinedResults" \
              --messageHeader ":github: Scheduled Checks"
