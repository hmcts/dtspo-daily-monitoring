parameters:
  - name: aks_clusters
    type: object

jobs:
  - job: DailyMonitoring
    dependsOn: ResolveSlackRecipient
    variables:
      main_channel: $[ dependencies.ResolveSlackRecipient.outputs['recipient.main_channel'] ]
    timeoutInMinutes: 60
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
        persistCredentials: true
      - task: AzureKeyVault@2
        displayName: 'Get secrets from Keyvault'
        inputs:
          azureSubscription:  "DTS-CFTPTL-INTSVC"
          keyVaultName:   "cftptl-intsvc"
          secretsFilter: 'dtspo-daily-checks-slack-webhook-url,dtspo-daily-checks-slack-bot-token,azure-devops-token,jira-api-token,jira-username,dtspo-daily-checks-github-fine-grained-token,dtspo-daily-checks-github-classic-token,jenkins-api-user,jenkins-api-token,launchdarkly-access-token,b2c-prod-serviceprincipal-id,b2c-prod-serviceprincipal-password,b2c-prod-tenant-id,sendgrid-hmcts-bau-nonprod-apikey'
      - task: Bash@3
        displayName: 'Set test mode'
        inputs:
          targetType: inline
          script: |
            echo "##vso[task.setvariable variable=testMode]false"
      - script: |
          echo "main_channel set to: $(main_channel)"
        displayName: 'Show main channel name'
      # The following checks use the common-functions.sh slack notifications and threads functions and will only send if negative status is found
      - task: AzureCLI@2
        displayName: 'Orphaned Resource Status Check'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/orphan-resource-check.sh
          azureSubscription: ${{ variables.service_connection }}
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: Bash@3
        displayName: 'Checking Jenkins status'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/jenkins-status.sh
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
            --jenkinsUsername $(jenkins-api-user)
            --jenkinsApiToken $(jenkins-api-token)
            --jenkinsURL ${{ variables.jenkins_url }}
      - task: Bash@3
        displayName: "Checking GitHub Pages review status"
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/github_pages_checks.sh
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: Bash@3
        displayName: 'Checking JIRA status'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/jira-status.sh
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel) --jiraUsername $(jira-username) --jiraToken $(jira-api-token)
      - task: AzureCLI@2
        displayName: 'Get Provisioning State'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/cluster-state-monitor.sh
          azureSubscription: ${{ variables.ado_service_connection }}
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: AzureCLI@2
        displayName: 'Check break-glass sign-ins'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/break-glass-signin-check.sh
          azureSubscription: 'GA-Prod-Tenant'
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: PublishPipelineArtifact@1
        displayName: 'Publish break-glass sign-in report'
        condition: always()
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)/scripts/break-glass-signin-check.sh'
          artifact: 'breakglass-signin-report'
      - task: Bash@3
        displayName: 'Commit break-glass sign-in report'
        continueOnError: true
        # Only master may commit the report; on other branches the rebase conflicts and the push targets master
        condition: and(always(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
        inputs:
          targetType: inline
          script: |
            set -euo pipefail

            git config user.email "${BUILD_REQUESTEDFOREMAIL:-azure-devops@local}"
            git config user.name "Azure Pipelines"
            git fetch origin master
            git add scripts/breakglass-signin-review.md

            if git diff --cached --quiet; then
              echo "No changes to the break-glass sign-in report."
              exit 0
            fi

            git commit -m "Update break-glass sign-in report [skip ci]"
            git rebase origin/master
            git push origin "HEAD:refs/heads/master"
      - task: Bash@3
        displayName: 'Check Toffee/Plum Status'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/check-toffee-plum.sh
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: Bash@3
        displayName: "Auto Shutdown status check"
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/autoShutdownChecks.sh
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: Bash@3
        displayName: 'Elastic search field count check'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/elastic-search-field-count.sh
          arguments: --slackBotToken $(dtspo-daily-checks-slack-bot-token) --slackChannelName $(main_channel)
      - task: Bash@3
        displayName: 'ElasticSearch DLQ Case Type count check'
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/elastic-search-dlq-case-type-count.sh
          arguments: >
            --sendgridApiKey $(sendgrid-hmcts-bau-nonprod-apikey)
            --emailTo "cft-level2-monitoring-aaaap23kppmnpt57cp3cbwpkym@moj.org.slack.com"
            --emailFrom bau@mail-bau-nonprod.platform.hmcts.net
            --testMode $(testMode)
      - task: AzureCLI@2
        displayName: 'Check DR Backup Vault Job Status (weekly, Mondays only)'
        continueOnError: true
        inputs:
          scriptType: bash
          scriptPath: scripts/dr-backup-vault-monitor.sh
          azureSubscription: 'DCD-CNP-Prod'
          arguments: >
            --resourceGroup mgmt-infra-prod-rg
            --backupVault cnp-backup-vault
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
      - ${{ each cluster in parameters.aks_clusters }}:
        - task: AzureCLI@2
          displayName: 'AKS Cluster Status:  ${{cluster.clusterName}}'
          continueOnError: true
          inputs:
            scriptType: bash
            scriptPath: scripts/aks-node-count.sh
            azureSubscription: ${{ cluster.subscription }}
            arguments: --resourceGroup ${{cluster.resourceGroup}} --aksClusterName ${{cluster.clusterName}}
      - task: Bash@3
        displayName: "Send AKS Cluster Status"
        continueOnError: true
        inputs:
          targetType: filePath
          filePath: scripts/send-slack-header-thread-each-loop.sh
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
            --inputFileName aks-cluster-status.txt
            --messageHeader ":aks: AKS Cluster Status Checks"
      # Final summary task - always runs and reports on any failed tasks
      - task: Bash@3
        displayName: "Pipeline Summary - Report Failed Tasks"
        condition: always()
        inputs:
          targetType: filePath
          filePath: scripts/pipeline-summary.sh
          arguments: >
            --slackBotToken $(dtspo-daily-checks-slack-bot-token)
            --slackChannelName $(main_channel)
            --buildId $(Build.BuildId)
            --buildUrl "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
            --jobStatus $(Agent.JobStatus)
