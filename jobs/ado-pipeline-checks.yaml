parameters:
  - name: ado_pipelines
    type: object

jobs:
  - job: AdoPipelineChecks
    displayName: 'Check Azure DevOps pipelines'
    dependsOn: ResolveSlackRecipient
    timeoutInMinutes: 60
    pool:
      name: 'hmcts-cftptl-agent-pool'
    steps:
      - checkout: self
      - task: Bash@3
        displayName: 'Initialize Azure DevOps pipeline results'
        inputs:
          targetType: inline
          script: ': > ado-pipeline-status.txt'
      - task: AzureKeyVault@2
        displayName: 'Get Slack and Azure DevOps tokens'
        inputs:
          azureSubscription: 'DTS-CFTPTL-INTSVC'
          keyVaultName: 'cftptl-intsvc'
          secretsFilter: 'dtspo-daily-checks-slack-bot-token,azure-devops-token'
      - ${{ each ado_pipeline in parameters.ado_pipelines }}:
        - task: Bash@3
          displayName: 'Checking Azure pipeline: ${{ ado_pipeline.pipelineName }}'
          continueOnError: true
          inputs:
            targetType: filePath
            filePath: scripts/ado-pipeline-monitor.sh
            arguments: >
              --adoToken $(azure-devops-token)
              --adoProject ${{ ado_pipeline.project }}
              --adoPipelineName "${{ ado_pipeline.pipelineName }}"
              --adoPipelineDefinitionId ${{ ado_pipeline.definitionId }}
              --adoTimeForAmber ${{ ado_pipeline.timeForAmber }}
              --adoTimeForRed ${{ ado_pipeline.timeForRed }}
              --adoPipelineBranch "${{ ado_pipeline.branchName }}"
              --weekdayOnly ${{ ado_pipeline.weekdayOnly }}
      - task: Bash@3
        displayName: 'Stage Azure DevOps pipeline results'
        condition: always()
        inputs:
          targetType: inline
          script: |
            mkdir -p "$(Build.ArtifactStagingDirectory)/ado-pipeline-results"
            cp ado-pipeline-status.txt "$(Build.ArtifactStagingDirectory)/ado-pipeline-results/results.txt"
      - task: PublishPipelineArtifact@1
        displayName: 'Publish Azure DevOps pipeline results'
        condition: always()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/ado-pipeline-results/results.txt'
          artifact: 'ado-pipeline-results'
